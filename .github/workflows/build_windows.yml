name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Release Executable
      run: flutter build windows --release

    - name: Print All Log Files on Failure
      if: failure()
      shell: powershell
      run: |
        Get-ChildItem -Path build -Recurse -Include *.log,*.txt | ForEach-Object {
          Write-Host "=========================================="
          Write-Host "=== FILE: $($_.FullName) ==="
          Write-Host "=========================================="
          Get-Content $_.FullName -Head 50
          Write-Host "--- TAIL ---"
          Get-Content $_.FullName -Tail 100
        }

    - name: Upload Build Log Artifacts on Failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-logs
        path: |
          build/**/*.log
          build/**/*.txt

    - name: Compress Executable & Assets
      shell: powershell
      run: |
        $found = $false
        foreach ($path in @(
          "build\windows\x64\runner\Release",
          "build\windows\runner\Release"
        )) {
          if (Test-Path $path) {
            Write-Host "Found output at: $path"
            Compress-Archive -Path "$path\*" -DestinationPath "school-windows-x64.zip" -Force
            $found = $true
            break
          }
        }
        if (-not $found) {
          throw "Release output directory not found!"
        }

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-exe
        path: school-windows-x64.zip
