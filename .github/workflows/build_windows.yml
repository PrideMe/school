name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Release Executable
      shell: cmd
      run: flutter build windows --release --verbose > build_verbose.log 2>&1

    - name: Display Build Failure Log
      if: failure()
      shell: powershell
      run: |
        Write-Host "=== LAST 200 LINES OF BUILD VERBOSE LOG ==="
        Get-Content build_verbose.log -Tail 200

    - name: Compress Executable & Assets
      shell: powershell
      run: |
        $found = $false
        foreach ($path in @(
          "build\windows\x64\runner\Release",
          "build\windows\runner\Release"
        )) {
          if (Test-Path $path) {
            Write-Host "Found output at: $path"
            Compress-Archive -Path "$path\*" -DestinationPath "school-windows-x64.zip" -Force
            $found = $true
            break
          }
        }
        if (-not $found) {
          throw "Release output directory not found!"
        }

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-exe
        path: school-windows-x64.zip

    - name: Upload Diagnostic Logs on Failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-diagnostic-log
        path: build_verbose.log
