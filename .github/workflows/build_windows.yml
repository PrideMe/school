name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64
        cache: false

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Executable
      shell: cmd
      run: flutter build windows --release --verbose

    - name: Compress Release Bundle into ZIP
      shell: powershell
      run: |
        $releaseDir = "build/windows/x64/runner/Release"
        Write-Host "=== VERIFYING RELEASE DIRECTORY CONTENTS ==="
        Get-ChildItem -Recurse $releaseDir
        
        $zipPath = "school-windows-release.zip"
        Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -Force
        
        $zipItem = Get-Item $zipPath
        Write-Host "=== CREATED ZIP ARCHIVE ==="
        Write-Host "Name: $($zipItem.Name), Size: $($zipItem.Length) bytes ($([math]::Round($zipItem.Length / 1MB, 2)) MB)"

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-release
        path: school-windows-release.zip
