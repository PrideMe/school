name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Clean Flutter Cache
      run: flutter clean

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Executable (Release with Debug Fallback)
      shell: powershell
      run: |
        Write-Host "=== Attempting Flutter Release Build ==="
        $ErrorActionPreference = "Continue"
        flutter build windows --release
        
        $releaseExe = "build\windows\x64\runner\Release\school.exe"
        if (-not (Test-Path $releaseExe)) {
          Write-Host "=== Release executable not created. Falling back to Debug Build ==="
          flutter build windows --debug
        }
        
        $debugExe = "build\windows\x64\runner\Debug\school.exe"
        if (-not (Test-Path $releaseExe) -and -not (Test-Path $debugExe)) {
          throw "Neither Release nor Debug executable could be compiled!"
        }

    - name: Compress Executable & Assets
      shell: powershell
      run: |
        $found = $false
        foreach ($path in @(
          "build\windows\x64\runner\Release",
          "build\windows\runner\Release",
          "build\windows\x64\runner\Debug",
          "build\windows\runner\Debug"
        )) {
          if (Test-Path "$path\school.exe") {
            Write-Host "Found executable at: $path\school.exe"
            Compress-Archive -Path "$path\*" -DestinationPath "school-windows-x64.zip" -Force
            $found = $true
            break
          }
        }
        if (-not $found) {
          throw "school.exe output directory not found!"
        }

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-exe
        path: school-windows-x64.zip
