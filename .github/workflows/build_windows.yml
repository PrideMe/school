name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Clean Flutter Build Cache
      run: flutter clean

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Release Executable
      run: flutter build windows --release

    - name: Compress Executable & Assets
      shell: powershell
      run: |
        $found = $false
        foreach ($path in @(
          "build\windows\x64\runner\Release",
          "build\windows\runner\Release"
        )) {
          if (Test-Path $path) {
            Write-Host "Found output at: $path"
            Compress-Archive -Path "$path\*" -DestinationPath "school-windows-x64.zip" -Force
            $found = $true
            break
          }
        }
        if (-not $found) {
          throw "Release output directory not found!"
        }

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-exe
        path: school-windows-x64.zip
