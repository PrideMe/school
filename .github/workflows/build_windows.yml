name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Release Executable
      run: flutter build windows --release

    - name: Compress Executable & Assets
      shell: powershell
      run: |
        if (Test-Path "build\windows\x64\runner\Release") {
          Write-Host "Compressing build\windows\x64\runner\Release..."
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "school-windows-x64.zip" -Force
        } elseif (Test-Path "build\windows\runner\Release") {
          Write-Host "Compressing build\windows\runner\Release..."
          Compress-Archive -Path "build\windows\runner\Release\*" -DestinationPath "school-windows-x64.zip" -Force
        } else {
          Write-Host "Searching build directory..."
          Get-ChildItem -Path "build" -Recurse
          throw "Release output directory not found!"
        }

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-exe
        path: school-windows-x64.zip
