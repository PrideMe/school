name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64
        cache: false

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Executable
      shell: cmd
      run: flutter build windows --release --verbose

    - name: Assemble Windows Bundle
      shell: powershell
      run: |
        $releaseDir = "build/windows/x64/runner/Release"
        $dataDir = "$releaseDir/data"
        if (-not (Test-Path $dataDir)) { New-Item -ItemType Directory -Force -Path $dataDir }

        # Copy flutter_windows.dll
        $dll = Get-ChildItem -Path . -Filter "flutter_windows.dll" -Recurse | Select-Object -First 1
        if ($dll) {
          Write-Host "Copying $($dll.FullName) to $releaseDir"
          Copy-Item -Path $dll.FullName -Destination $releaseDir -Force
        }

        # Copy icudtl.dat
        $icu = Get-ChildItem -Path . -Filter "icudtl.dat" -Recurse | Select-Object -First 1
        if ($icu) {
          Write-Host "Copying $($icu.FullName) to $dataDir"
          Copy-Item -Path $icu.FullName -Destination $dataDir -Force
        }

        # Copy flutter_assets
        $assets = Get-ChildItem -Path build -Filter "flutter_assets" -Recurse -Directory | Select-Object -First 1
        if ($assets -and -not (Test-Path "$dataDir/flutter_assets")) {
          Write-Host "Copying $($assets.FullName) to $dataDir"
          Copy-Item -Path $assets.FullName -Destination $dataDir -Recurse -Force
        }

        # List all assembled bundle contents
        Get-ChildItem -Recurse $releaseDir

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-exe
        path: build/windows/x64/runner/Release/
