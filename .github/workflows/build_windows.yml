name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Executable
      shell: powershell
      run: |
        flutter build windows --release -v 2>&1 | Out-File -FilePath build.log -Encoding utf8
        if ($LASTEXITCODE -ne 0) {
          Write-Host "================== SEARCHING BUILD LOG FOR ERRORS =================="
          $matches = Select-String -Path build.log -Pattern "error","failed","fatal","CMake Error","MSB" -Context 2,2
          if ($matches) {
            foreach ($m in $matches) {
              Write-Host "--- MATCH FOUND ---"
              $m.Context.PreContext | ForEach-Object { Write-Host "  " $_ }
              Write-Host ">> " $m.Line
              $m.Context.PostContext | ForEach-Object { Write-Host "  " $_ }
            }
          } else {
            Get-Content build.log -Tail 100
          }
          exit $LASTEXITCODE
        }

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-exe
        path: build/windows/x64/runner/Release/
