name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64
        cache: true

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Executable
      shell: powershell
      run: |
        $p = Start-Process -FilePath "flutter.bat" -ArgumentList "build","windows","--release","-v" -NoNewWindow -PassThru -Wait -RedirectStandardOutput "build_log_full.txt" -RedirectStandardError "build_err_full.txt"
        if (Test-Path "build_err_full.txt") {
            Get-Content "build_err_full.txt" | Out-File -FilePath "build_log_full.txt" -Append -Encoding utf8
        }
        Write-Host "==================== FULL BUILD LOG OUTPUT ===================="
        Get-Content "build_log_full.txt"
        if ($p.ExitCode -ne 0) {
            exit $p.ExitCode
        }

    - name: Upload Full Diagnostic Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-full
        path: build_log_full.txt

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-exe
        path: build/windows/x64/runner/Release/
