name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64
        cache: true

    - name: Enable Windows Desktop Support
      run: flutter config --enable-windows-desktop

    - name: Get Flutter Dependencies
      run: flutter pub get

    - name: Build Windows Executable
      shell: powershell
      run: |
        $processInfo = New-Object System.Diagnostics.ProcessStartInfo
        $processInfo.FileName = "flutter.bat"
        $processInfo.Arguments = "build windows --release -v"
        $processInfo.RedirectStandardOutput = $true
        $processInfo.RedirectStandardError = $true
        $processInfo.UseShellExecute = $false
        $processInfo.CreateNoWindow = $true

        $process = New-Object System.Diagnostics.Process
        $process.StartInfo = $processInfo

        $log = New-Object System.Collections.Generic.List[string]

        $outHandler = {
            if ($EventArgs.Data) {
                Write-Host $EventArgs.Data
                $log.Add($EventArgs.Data)
            }
        }

        $errHandler = {
            if ($EventArgs.Data) {
                Write-Host $EventArgs.Data
                $log.Add($EventArgs.Data)
            }
        }

        Register-ObjectEvent -InputObject $process -EventName "OutputDataReceived" -Action $outHandler | Out-Null
        Register-ObjectEvent -InputObject $process -EventName "ErrorDataReceived" -Action $errHandler | Out-Null

        $process.Start() | Out-Null
        $process.BeginOutputReadLine()
        $process.BeginErrorReadLine()
        $process.WaitForExit()

        $log | Out-File -FilePath "build_log_full.txt" -Encoding utf8

        if ($process.ExitCode -ne 0) {
            Write-Host "==================== FATAL BUILD ERROR DETECTED ===================="
            $matches = $log | Select-String -Pattern "error","failed","fatal","CMake Error","MSB"
            foreach ($m in $matches) {
                Write-Host ">> " $m.Line
            }
            exit $process.ExitCode
        }

    - name: Upload Full Diagnostic Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-full
        path: build_log_full.txt

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: school-windows-exe
        path: build/windows/x64/runner/Release/
